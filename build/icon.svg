<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <ellipse id="orbit" cx="512" cy="512" rx="320" ry="118" fill="none" />
  </defs>
  <!-- 824 x 824 rounded square, radius 185. A path, because Chromium leaves faint specks outside a rounded rect. -->
  <path d="M285 100H739A185 185 0 0 1 924 285V739A185 185 0 0 1 739 924H285A185 185 0 0 1 100 739V285A185 185 0 0 1 285 100Z" fill="#1D1D21" />
  <!-- Each orbit is drawn over a wider charcoal stroke, so it appears to pass over the ones before it. -->
  <use href="#orbit" stroke="#1D1D21" stroke-width="72" />
  <use href="#orbit" stroke="#F1EFEA" stroke-width="28" />
  <use href="#orbit" transform="rotate(60 512 512)" stroke="#1D1D21" stroke-width="72" />
  <use href="#orbit" transform="rotate(60 512 512)" stroke="#F1EFEA" stroke-width="28" />
  <use href="#orbit" transform="rotate(120 512 512)" stroke="#1D1D21" stroke-width="72" />
  <use href="#orbit" transform="rotate(120 512 512)" stroke="#F1EFEA" stroke-width="28" />
  <circle cx="512" cy="512" r="87" fill="#1D1D21" />
  <circle cx="512" cy="512" r="63" fill="#F2A93B" />
