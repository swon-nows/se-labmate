appId: com.researchassistant.app
productName: SE LabMate
directories:
  buildResources: build
files:
  - 'out/**'
  - 'resources/**'
asarUnpack:
  - resources/**
win:
  executableName: research-assistant
  target:
    - target: nsis
      arch: [x64]
nsis:
  artifactName: se-labmate-${version}-${arch}.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  identity: '-'
  target:
    - target: dmg
      arch: [arm64, x64]
  entitlementsInherit: build/entitlements.mac.plist
  notarize: false
  extendInfo:
    # Electron finds helper apps by CFBundleName, so it must equal the productName electron-builder names them after
    CFBundleName: SE LabMate
dmg:
  artifactName: se-labmate-${version}-${arch}.${ext}
npmRebuild: false
