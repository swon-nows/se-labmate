name: Build Windows trial installer

on: workflow_dispatch

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:win
      - uses: actions/upload-artifact@v7
        with:
          name: research-assistant-windows
          path: dist/*.exe
          if-no-files-found: error
